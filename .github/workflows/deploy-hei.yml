name: Build hei-web image

# Construye la imagen Docker del sitio Grupo HEI y la publica en GHCR
# (ghcr.io/juanmrueda/hei-web). Corre en GitHub (nube), sin Docker local.
# Azure App Service for Containers jala esa imagen.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "apps/hei-web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-hei.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hei-web/Dockerfile
          push: true
          tags: |
            ghcr.io/juanmrueda/hei-web:latest
            ghcr.io/juanmrueda/hei-web:${{ github.sha }}

      # Avisa a Azure que jale la imagen recien publicada, para no tener que
      # correr `az webapp restart` a mano en cada cambio. El webhook sale de:
      #   az webapp deployment container config -n grupohei-web -g hei-rg --enable-cd true
      # y se guarda como el secret AZURE_WEBHOOK del repo. Sin el secret, este
      # paso no falla: solo avisa que el deploy queda manual.
      - name: Desplegar en Azure
        env:
          HOOK: ${{ secrets.AZURE_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Sin AZURE_WEBHOOK: omitiendo. Corre 'az webapp restart -n grupohei-web -g hei-rg' para desplegar."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK" > /dev/null
          echo "Azure notificado: jalando ghcr.io/juanmrueda/hei-web:latest"
